<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sssss Practice 🐍</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .mode-selector {
            margin-bottom: 20px;
            font-size: 16px;
        }
        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        button:active {
            transform: scale(0.98);
        }
        button.listening {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
        #output {
            margin-top: 25px;
            font-size: 18px;
            min-height: 60px;
        }
        .heard {
            color: #7f8c8d;
            font-style: italic;
            font-size: 15px;
            margin-top: 8px;
        }
        .result-message {
            font-weight: bold;
            font-size: 22px;
            margin-top: 10px;
        }
        .success { color: #27ae60; }
        .retry { color: #e67e22; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sssss Practice 🐍</h1>
        
        <div class="mode-selector">
            <label for="mode">Mode: </label>
            <select id="mode">
                <option value="strict">Strict (s, ss, sss...)</option>
                <option value="flexible" selected>Flexible (+ ess, es)</option>
            </select>
        </div>

        <button id="recordBtn" onclick="toggleListening()">🎤 Say Sssss</button>

        <div id="output">
            <div id="statusText">Press the button and hold the sound!</div>
            <div id="heardText" class="heard"></div>
            <div id="resultMessage" class="result-message"></div>
        </div>
    </div>

    <!-- Аудіо пісеньки (можна замінити посилання на свій файл або онлайн-джерело) -->
    <audio id="successAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const heardText = document.getElementById('heardText');
        const resultMessage = document.getElementById('resultMessage');
        const modeSelect = document.getElementById('mode');
        const successAudio = document.getElementById('successAudio');

        let recognition = null;
        let isListening = false;

        if (!SpeechRecognition) {
            statusText.innerHTML = "❌ Speech Recognition is not supported in this browser. Please use Google Chrome.";
            recordBtn.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 3; // Беремо кілька варіантів від браузера

            recognition.onstart = () => {
                isListening = true;
                recordBtn.classList.add('listening');
                recordBtn.innerText = "Listening... 🎤";
                statusText.innerText = "Listening (speak clearly)...";
                heardText.innerText = "";
                resultMessage.innerText = "";
            };

            recognition.onresult = (event) => {
                // Збираємо основний варіант та альтернативи, якщо вони є
                let transcripts = [];
                for (let i = 0; i < event.results[0].length; i++) {
                    transcripts.push(event.results[0][i].transcript.trim().toLowerCase());
                }
                
                const bestTranscript = transcripts[0];
                const confidence = event.results[0][0].confidence;

                heardText.innerText = `I heard: "${bestTranscript}" (variants: ${transcripts.join(', ')}) [conf: ${confidence ? confidence.toFixed(2) : 'N/A'}]`;

                evaluateSpeech(transcripts);
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                statusText.innerText = `Error: ${event.error}`;
                stopListeningState();
            };

            recognition.onend = () => {
                stopListeningState();
            };
        }

        function toggleListening() {
            if (!recognition) return;

            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function stopListeningState() {
            isListening = false;
            recordBtn.classList.remove('listening');
            recordBtn.innerText = "🎤 Say Sssss";
        }

        function evaluateSpeech(transcripts) {
            const mode = modeSelect.value;
            
            // Базові варіанти для Strict
            let validVariants = ['s', 'ss', 'sss', 'ssss', 'sssss', 's s', 's s s'];

            if (mode === 'flexible') {
                // Додаємо типові хибні спрацьовування STT для шиплячих/свистячих
                validVariants.push('ess', 'es', 'is', 'c', 'cedar', 'yes', 'sh', 'ssh');
            }

            // Перевіряємо, чи хоча б один із розпізнаних варіантів (або слово всередині них) підходить
            let isMatch = transcripts.some(t => {
                // Пряма перевірка
                if (validVariants.includes(t)) return true;
                // Або якщо це просто повторення літери s (наприклад "sssss")
                if (/^s+$/.test(t)) return true;
                return false;
            });

            if (isMatch) {
                resultMessage.className = "result-message success";
                resultMessage.innerText = "Correct! 🎉";
                statusText.innerText = "Great job!";
                successAudio.currentTime = 0;
                successAudio.play().catch(e => console.log("Audio play blocked:", e));
            } else {
                resultMessage.className = "result-message retry";
                resultMessage.innerText = "Try again! 🔄";
                statusText.innerText = "Keep practicing!";
            }
        }
    </script>
</body>
</html>
